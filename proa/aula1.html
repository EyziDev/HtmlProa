<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proa Aula 1</title>
    <style>
        .img1{
            width: 50%;
        }
        .gif1{
            width: 50%;
        }

        body{
            font-size: 20px; /*tamanho da fonte*/
            font-family: Verdana; /*tipo de fonte*/
            color: red;
            background-color: whitesmoke;
            background-image: url(image/gif1.gif);
            background-attachment: fixed;
        }
        h1{
            font-size: 90px;
            color: blue;
            text-align: center; /*Alinha o conteúdo no centro*/
            border-color: black;
            border-radius: 50px;
        }
        .p1{
            font-size: 50px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: aqua;
            text-align: left;
        }
        .p2{
            text-align: center;
            font-size: 50px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            color: rgb(94, 143, 4);
        }
        .p3{
            text-align: right;
            font-size: 50px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: rgb(155, 0, 245);
        }
        .p4{
            font-size: 60px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-style: italic;
            color: rgb(255, 238, 0);
            text-align: justify;
        }
        .p5{
            font-size: 30px;
            color: beige;
            text-align: justify;
        }
    </style>
</head>
<body> <!--É o corpo da página-->
    <h1>PROA</h1>
    <hr>
    <p class="p1"> Alguma Coisa </p> <!--A tag "<p>" serve para a criação de parágrafo-->
    <p class="p2"> Segunda Coisa</p>
    <p class="p3"> Terceira Coisa</p>
    <br> <!--Tag usada para quebrar linhas-->
    <hr> <!--Tag usada para colocar uma linha na horizontal-->
    <p class="p4"> Quinta Coisa</p>
    <p class="p5"> Lorem ipsum dolor sit amet consectetur adipisicing elit. Eius ipsam amet laboriosam minima modi dolorem veniam natus, asperiores enim repellat nemo cumque. Dignissimos itaque voluptate enim asperiores deleniti voluptates officiis?</p>

    <img src="image/img1.jpg" class="img1"/> 
    <img src="image/gif2.gif" class="gif1"/>
</body>
</html>
